version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
      - REACT_APP_API_URL=https://backend.estheticsbyanna.com
    depends_on:
      - backend
      - sanity-cms
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - PLUNK_API_KEY=${PLUNK_API_KEY}
      - PLUNK_FROM_EMAIL=${PLUNK_FROM_EMAIL}
      - PLUNK_FROM_NAME=${PLUNK_FROM_NAME}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
      - FRONTEND_URL=https://estheticsbyanna.com
      - CORS_ORIGIN=https://estheticsbyanna.com
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  sanity-cms:
    build:
      context: ./sanity-cms
      dockerfile: Dockerfile
    ports:
      - "3333:3333"
    environment:
      - NODE_ENV=production
      - SANITY_STUDIO_PROJECT_ID=${SANITY_STUDIO_PROJECT_ID}
      - SANITY_STUDIO_DATASET=${SANITY_STUDIO_DATASET}
      - SANITY_STUDIO_API_VERSION=${SANITY_STUDIO_API_VERSION}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3333"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  default:
    driver: bridge